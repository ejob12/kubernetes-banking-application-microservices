name: LionTech Finance CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: liontech-finance-eks
  ECR_REPOSITORY_PREFIX: banking-app
  KUBE_NAMESPACE: liontech-finance
  SONAR_PROJECT_KEY: liontech-finance

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-scan:
    name: Validate and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript and run smoke test
        run: |
          set -euo pipefail
          node --check shared/src/auth.js
          node --check shared/src/http.js
          node --check shared/src/server.js
          node --check shared/src/store.js
          node --check gateway/src/index.js
          for service in accounts admin ai analytics auth balancer deposits notifications profile transfers; do
            node --check "services/${service}/src/index.js"
          done
          node scripts/smoke-test.js

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.scm.provider=git

  build-and-push:
    name: Build and push images
    needs: validate-and-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.metadata.outputs.image-tag }}
      ecr-registry: ${{ steps.aws.outputs.ecr-registry }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-liontech-finance

      - name: Resolve image metadata
        id: metadata
        run: echo "image-tag=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resolve AWS account and ECR registry
        id: aws
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "ecr-registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          set -euo pipefail
          for image in frontend gateway accounts admin ai analytics auth balancer deposits notifications profile transfers; do
            repository="${ECR_REPOSITORY_PREFIX}/${image}"
            aws ecr describe-repositories \
              --repository-names "$repository" \
              --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$repository" \
              --image-scanning-configuration scanOnPush=true \
              --region "$AWS_REGION" >/dev/null
          done

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image-tag }}
          ECR_REGISTRY: ${{ steps.aws.outputs.ecr-registry }}
        run: |
          set -euo pipefail
          for image in frontend gateway accounts admin ai analytics auth balancer deposits notifications profile transfers; do
            dockerfile="${image}/Dockerfile"
            if [[ "$image" != "frontend" && "$image" != "gateway" ]]; then
              dockerfile="services/${image}/Dockerfile"
            fi
            repository="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${image}"
            docker build -f "$dockerfile" -t "${repository}:${IMAGE_TAG}" -t "${repository}:latest" .
            docker push "${repository}:${IMAGE_TAG}"
            docker push "${repository}:latest"
          done

  deploy-to-eks:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-liontech-finance-deploy

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Apply manifest and deploy images
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr-registry }}
          AUTH_SECRET: ${{ secrets.LIONTECH_FINANCE_AUTH_SECRET }}
          SERVICE_TOKEN: ${{ secrets.LIONTECH_FINANCE_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/liontech-finance.yaml
          kubectl -n "$KUBE_NAMESPACE" create secret generic liontech-finance-secrets \
            --from-literal=AUTH_SECRET="$AUTH_SECRET" \
            --from-literal=SERVICE_TOKEN="$SERVICE_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          for image in frontend gateway auth profile accounts balancer notifications deposits transfers analytics ai admin; do
            case "$image" in
              frontend) deployment=frontend ;;
              gateway) deployment=api-gateway ;;
              *) deployment="${image}-service" ;;
            esac
            kubectl -n "$KUBE_NAMESPACE" set image "deployment/${deployment}" \
              "${deployment}=${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${image}:${IMAGE_TAG}"
            kubectl -n "$KUBE_NAMESPACE" rollout status "deployment/${deployment}" --timeout=180s
          done
          kubectl -n "$KUBE_NAMESPACE" get pods,svc
